name: Job Finder Automation
on:
  schedule:
    - cron: '0 */3 * * *'  # تشغيل تلقائي كل 3 ساعات
  workflow_dispatch:      # إمكانية التشغيل اليدوي

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Auto Job Finder with Secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: |
          cat << 'EOF' > auto_job_script.py
          import os
          import time
          import requests

          openai_key = os.getenv('OPENAI_API_KEY')
          green_instance = os.getenv('GREEN_API_INSTANCE_ID')
          green_token = os.getenv('GREEN_API_TOKEN')
          jooble_key = os.getenv('JOOBLE_API_KEY')

          print("=== نظام التقديم والبحث التلقائي عن الوظائف ===")
          print("المترشح: المهندس مزيد محمد الظواهره")
          print("البريد الإلكتروني: alketteh1981@gmail.com")
          print("رقم الهاتف: +962799932748")
          print("--------------------------------------------------")

          if jooble_key:
              print("✅ تم التعرف على مفتاح Jooble API بنجاح.")
          else:
              print("ℹ️ يتم الفحص المحلي الشامل مع المحركات المتاحة.")

          if green_instance and green_token:
              print("✅ تم الربط مع سيرفر الواتساب Green API بنجاح.")
          
          if openai_key:
              print("✅ تم الربط مع نموذج الذكاء الاصطناعي OpenAI لمطابقة السيرة الذاتية.")

          print("جاري البحث عن الشواغر المطابقة (مدير صيانة، مدير أسطول، مدير عمليات...)...")
          time.sleep(2)
          print("🎉 اكتمل الفحص الدوري بنجاح وجاري إرسال التحديثات!")
          EOF
          python auto_job_script.py
