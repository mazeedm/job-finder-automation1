name: Job Finder Automation
on:
  schedule:
    - cron: '0 */3 * * *'  # تشغيل تلقائي كل 3 ساعات
  workflow_dispatch:      # تشغيل يدوي

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Job Finder
        run: |
          if [ -f "auto_job_system_ready.py" ]; then
            python auto_job_system_ready.py
          elif [ -f "job_finder_ready.py" ]; then
            python job_finder_ready.py
          else
            python main.py
          fi
