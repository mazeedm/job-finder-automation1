name: Job Finder Automation
on:
  schedule:
    - cron: '0 */3 * * *'  # تشغيل كل 3 ساعات تلقائياً
  workflow_dispatch:      # إمكانية التشغيل اليدوي

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Job Finder
        run: python auto_job_system_ready.py
